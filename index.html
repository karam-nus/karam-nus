<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap');

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --red:      #cc2222;
  --red-dim:  #7a0f0f;
  --red-deep: #1e0808;
  --red-faint:#110505;
  --white:    #e8e8e8;
  --mid:      #2e2e2e;
  --dim:      #1a1a1a;
  --dimmer:   #111;
  --track-glow: 0 0 8px rgba(180,20,20,.7), 0 0 22px rgba(130,0,0,.35);
}

html { scroll-behavior: smooth; }

body {
  background: #000;
  color: #ccc;
  font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Courier New', monospace;
  min-height: 100vh;
  padding: 56px 28px 100px;
}

/* ── scanline texture overlay ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,.08) 2px,
    rgba(0,0,0,.08) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

.wrap { max-width: 960px; margin: 0 auto; }

/* ── header ── */
.hdr { text-align: center; margin-bottom: 56px; }
.hdr-name {
  font-size: 20px;
  font-weight: 600;
  color: var(--white);
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.hdr-sub {
  font-size: 10px;
  color: #2a2a2a;
  letter-spacing: .16em;
  text-transform: uppercase;
}
.hdr-sub a {
  color: #2a2a2a;
  text-decoration: none;
  transition: color .2s;
}
.hdr-sub a:hover { color: var(--red); }

/* ── panel ── */
.panel {
  background: #070707;
  border: 1px solid #111;
  border-radius: 0;
  padding: 32px 36px;
}

/* ── seg label ── */
.seg-label {
  font-size: 9px;
  letter-spacing: .18em;
  color: #1e1e1e;
  text-transform: uppercase;
  margin-bottom: 16px;
}

/* ── scrollable tab row ── */
.seg-scroll {
  overflow-x: auto;
  margin-bottom: 40px;
  padding-bottom: 8px;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.seg-scroll::-webkit-scrollbar { display: none; }

.seg {
  position: relative;
  display: inline-flex;
  gap: 32px;
  white-space: nowrap;
  min-width: 100%;
}

.seg-item {
  color: #232323;
  font-size: 11px;
  font-family: inherit;
  font-weight: 400;
  padding: 6px 0;
  cursor: pointer;
  position: relative;
  z-index: 1;
  transition: color .15s;
  white-space: nowrap;
  background: none;
  border: none;
  outline: none;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.seg-item:hover { color: #555; }
.seg-item.active {
  color: var(--white);
  font-weight: 500;
}

.seg-track {
  position: absolute;
  bottom: -1px;
  left: 0;
  height: 2px;
  background: linear-gradient(
    to right,
    transparent,
    var(--red-dim) 20%,
    var(--red) 50%,
    var(--red-dim) 80%,
    transparent
  );
  border-radius: 0;
  box-shadow: var(--track-glow);
  transition:
    left  .22s cubic-bezier(.4,0,.2,1),
    width .22s cubic-bezier(.4,0,.2,1);
  pointer-events: none;
}

/* ── content panels ── */
.content { display: none; }
.content.active { display: block; }

/* repo meta bar */
.repo-meta {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 1px solid #100808;
}
.repo-link {
  font-size: 10px;
  font-family: inherit;
  color: #2a2a2a;
  text-decoration: none;
  letter-spacing: .14em;
  text-transform: uppercase;
  transition: color .2s;
}
.repo-link:hover { color: var(--red); }
.repo-count {
  font-size: 10px;
  color: #171717;
  letter-spacing: .08em;
}

/* chapter groups */
.group { margin-bottom: 32px; }
.group-label {
  font-size: 9px;
  letter-spacing: .14em;
  color: var(--red-deep);
  text-transform: uppercase;
  margin-bottom: 2px;
  padding-bottom: 10px;
  border-bottom: 1px solid #120606;
}

/* chapter row */
.ch {
  display: flex;
  align-items: baseline;
  gap: 16px;
  padding: 9px 0;
  border-bottom: 1px solid #0d0d0d;
  transition: border-color .15s;
}
.ch:last-child { border-bottom: none; }
.ch:hover { border-color: #1e0808; }

.ch-num {
  font-size: 10px;
  color: #1c1c1c;
  font-variant-numeric: tabular-nums;
  min-width: 20px;
  flex-shrink: 0;
  letter-spacing: .04em;
}
.ch-link {
  color: #444;
  font-size: 12px;
  font-family: inherit;
  text-decoration: none;
  transition: color .15s;
  flex-shrink: 0;
  letter-spacing: .03em;
}
.ch-link:hover { color: var(--red); }
.ch-link.planned {
  color: #1a1a1a;
  cursor: default;
  pointer-events: none;
}
.ch-desc {
  color: #1c1010;
  font-size: 11px;
  flex: 1;
  min-width: 0;
  letter-spacing: .02em;
}

/* metrics pill layout */
.pill-group { margin-bottom: 24px; }
.pill-group-label {
  font-size: 9px;
  letter-spacing: .14em;
  color: var(--red-deep);
  text-transform: uppercase;
  margin-bottom: 0;
  padding-bottom: 10px;
  border-bottom: 1px solid #120606;
}
.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 12px 0;
}
.pill {
  font-size: 10px;
  font-family: inherit;
  color: #2a1515;
  background: #0a0303;
  border: 1px solid #170808;
  border-radius: 0;
  padding: 4px 10px;
  letter-spacing: .06em;
  white-space: nowrap;
  transition: color .15s, border-color .15s;
}
.pill:hover { color: #553030; border-color: var(--red-deep); }
</style>

/* ── build tab strip ── */
const seg = document.getElementById('seg');
repos.forEach((r,i) => {
  const btn = document.createElement('button');
  btn.className = 'seg-item' + (i===0?' active':'');
  btn.textContent = r.label;
  btn.dataset.id = r.id;
  btn.addEventListener('click', () => activate(r.id));
  seg.appendChild(btn);
});
const track = document.createElement('div');
track.className = 'seg-track';
seg.appendChild(track);

/* ── build content panels ── */
const contentEl = document.getElementById('content');
repos.forEach((r,i) => {
  const div = document.createElement('div');
  div.className = 'content' + (i===0?' active':'');
  div.id = 'panel-'+r.id;

  // meta bar
  const meta = document.createElement('div');
  meta.className = 'repo-meta';
  const a = document.createElement('a');
  a.className = 'repo-link';
  a.href = r.url; a.target='_blank'; a.rel='noopener';
  a.textContent = r.label + ' \u2197';
  const cnt = document.createElement('span');
  cnt.className = 'repo-count';
  cnt.textContent = r.count;
  meta.appendChild(a); meta.appendChild(cnt);
  div.appendChild(meta);

  if (r.pillGroups) {
    r.pillGroups.forEach(g => {
      const pg = document.createElement('div');
      pg.className = 'pill-group';
      const lbl = document.createElement('div');
      lbl.className = 'pill-group-label';
      lbl.textContent = g.name;
      pg.appendChild(lbl);
      const pills = document.createElement('div');
      pills.className = 'pills';
      g.pills.forEach(p => {
        const pill = document.createElement('span');
        pill.className = 'pill';
        pill.textContent = p;
        pills.appendChild(pill);
      });
      pg.appendChild(pills);
      div.appendChild(pg);
    });
  } else {
    r.groups.forEach(g => {
      const grpDiv = document.createElement('div');
      grpDiv.className = 'group';
      if (g.name) {
        const lbl = document.createElement('div');
        lbl.className = 'group-label';
        lbl.textContent = g.name;
        grpDiv.appendChild(lbl);
      }
      g.chs.forEach(ch => {
        const row = document.createElement('div');
        row.className = 'ch';
        const num = document.createElement('span');
        num.className = 'ch-num';
        num.textContent = ch.n;
        row.appendChild(num);
        if (ch.u) {
          const lnk = document.createElement('a');
          lnk.className = 'ch-link';
          lnk.href = r.base + ch.u;
          lnk.target = '_blank'; lnk.rel = 'noopener';
          lnk.textContent = ch.t;
          row.appendChild(lnk);
        } else {
          const span = document.createElement('span');
          span.className = 'ch-link planned';
          span.textContent = ch.t;
          row.appendChild(span);
        }
        if (ch.d) {
          const desc = document.createElement('span');
          desc.className = 'ch-desc';
          desc.textContent = '\u00b7 ' + ch.d;
          row.appendChild(desc);
        }
        grpDiv.appendChild(row);
      });
      div.appendChild(grpDiv);
    });
  }
  contentEl.appendChild(div);
});

/* ── tab switching ── */
function moveTrack() {
  const active = seg.querySelector('.seg-item.active');
  if (!active) return;
  track.style.left  = active.offsetLeft + 'px';
  track.style.width = active.offsetWidth + 'px';
}
function activate(id) {
  seg.querySelectorAll('.seg-item').forEach(b =>
    b.classList.toggle('active', b.dataset.id === id)
  );
  document.querySelectorAll('.content').forEach(c =>
    c.classList.toggle('active', c.id === 'panel-'+id)
  );
  moveTrack();
  seg.querySelector('.seg-item.active')
     ?.scrollIntoView({block:'nearest', inline:'nearest'});
}
window.addEventListener('load',   () => setTimeout(moveTrack, 40));
window.addEventListener('resize', moveTrack);
</script>
